name: Agent eval (live model)

# Nightly run of the 180-case golden set against the real model
# (SYSTEM_DESIGN §9). The offline version gates every PR in CI.
on:
  schedule:
    - cron: "17 19 * * *" # 02:17 in Vietnam (UTC+7)
  workflow_dispatch:
    inputs:
      min_pass:
        description: "Pass-rate gate (0–1)"
        default: "0.95"

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.OPENAI_API_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - name: Run eval
        if: steps.secrets.outputs.ok == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL || 'gpt-4o-mini' }}
          # Evaluate what production would serve.
          CONTENT_REQUIRE_REVIEWED: ${{ vars.CONTENT_REQUIRE_REVIEWED || 'false' }}
        run: bun run eval --min-pass "${{ inputs.min_pass || '0.95' }}" --out eval-results.json
      - name: Skipped
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::warning::OPENAI_API_KEY secret not set; live eval skipped."
      - uses: actions/upload-artifact@v4
        if: always() && steps.secrets.outputs.ok == 'true'
        with:
          name: eval-results
          path: eval-results.json
