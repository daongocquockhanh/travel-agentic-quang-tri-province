name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx eslint app components lib scripts tests
      - name: Content checks
        run: bun run content:check
      # Unit, component, offline agent eval (216 cases) and RLS tests.
      # The runner image ships Postgres 16, which the RLS suite starts on its own port.
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build

  # Every push to main that passes the checks ships to Cloudflare Workers.
  # Runtime secrets (API keys) live in Cloudflare (`wrangler secret put`) and
  # survive deploys; NEXT_PUBLIC_* values are inlined at build, so they come
  # from repo variables here.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://quang-tri-travel-agent.dnqkhanhhcmiu.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Build and deploy
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: bun run deploy
      - name: Smoke test
        if: steps.secrets.outputs.ok == 'true'
        run: scripts/smoke-test.sh https://quang-tri-travel-agent.dnqkhanhhcmiu.workers.dev
      - name: Rollback hint
        if: failure() && steps.secrets.outputs.ok == 'true'
        run: |
          echo "::error::Production smoke test failed. Roll back with: bunx wrangler rollback"
          echo "Production smoke test failed. Roll back to the previous version with \`bunx wrangler rollback\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Skipped
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set; deploy skipped."

  # Each pull request gets its own preview URL (pr-<number>-…workers.dev):
  # a new Worker version is uploaded without being deployed, so production
  # traffic never sees it. Previews share production's secrets and quota.
  # Fork PRs get no secrets, so they skip this.
  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Build
        if: steps.secrets.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: bun run content:bundle && bunx opennextjs-cloudflare build
      - name: Upload preview version
        id: upload
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          out=$(bunx wrangler versions upload --preview-alias "pr-$PR_NUMBER" --message "PR #$PR_NUMBER (${SHA:0:7})" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          url=$(grep -oE "https://pr-$PR_NUMBER-[a-z0-9.-]+\.workers\.dev" <<<"$out" | head -1)
          [[ -n "$url" ]] || { echo "::error::No preview URL in wrangler output"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview for PR #$PR_NUMBER: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test
        if: steps.secrets.outputs.ok == 'true'
        env:
          PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: scripts/smoke-test.sh "$PREVIEW_URL"
      - name: Skipped
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set; preview skipped."
