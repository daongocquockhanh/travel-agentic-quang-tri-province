name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a main run: it may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bunx eslint app components lib scripts tests
      - name: Content checks
        run: bun run content:check
      # Unit, component, offline agent eval (180 cases) and RLS tests.
      # The runner image ships Postgres 16, which the RLS suite starts on its own port.
      - name: Tests
        run: bun run test
      - name: Build
        run: bun run build

  # Every push to main that passes the checks ships to Cloudflare Workers.
  # Runtime secrets (API keys) live in Cloudflare (`wrangler secret put`) and
  # survive deploys; NEXT_PUBLIC_* values are inlined at build, so they come
  # from repo variables here.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://quang-tri-travel-agent.dnqkhanhhcmiu.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Build and deploy
        if: steps.secrets.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_MAPBOX_TOKEN: ${{ vars.NEXT_PUBLIC_MAPBOX_TOKEN }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
        run: bun run deploy
      - name: Skipped
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret not set; deploy skipped."
