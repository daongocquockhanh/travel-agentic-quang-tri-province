name: Mobile

# Compiles the native shells (docs/STORE_RELEASE.md). Android runs when the
# shell or its config changes and uploads a debug APK you can install on a
# phone; iOS (macOS runners bill ~10x) runs only on demand.
on:
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      ios:
        description: "Also build iOS (simulator, unsigned)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Sync Capacitor
        run: bunx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: quang-tri-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  ios:
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Sync Capacitor
        run: bunx cap sync ios
      - name: Build for simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO build
