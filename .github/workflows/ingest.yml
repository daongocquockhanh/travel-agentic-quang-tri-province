name: Ingest content

# SYSTEM_DESIGN §5.4: ingest curated content on merge to main.
# Refuses to run while any section is still a draft (INGEST_REQUIRE_REVIEWED=1).
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/ingest.ts"
      - "lib/content-check.ts"
  workflow_dispatch:

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Check secrets
        id: secrets
        run: echo "ok=${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && (secrets.GOOGLE_GENERATIVE_AI_API_KEY != '' || secrets.OPENAI_API_KEY != '') }}" >> "$GITHUB_OUTPUT"
      - name: Content checks
        run: bun run content:check
      # Drafts aren't a failure, just not ready: warn and skip until everything is reviewed.
      - name: All content reviewed?
        id: reviewed
        run: |
          if bun run content:check --strict > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Some sections are still drafts; production ingest skipped. See docs/CONTENT_GUIDE.md."
          fi
      - name: Ingest
        if: steps.secrets.outputs.ok == 'true' && steps.reviewed.outputs.ok == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INGEST_REQUIRE_REVIEWED: "1"
        run: bun run ingest
      - name: Skipped
        if: steps.secrets.outputs.ok != 'true'
        run: echo "::warning::Supabase/AI key secrets not set; ingest skipped."
