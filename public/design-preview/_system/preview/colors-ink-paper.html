<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Colors · Ink & paper</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 20px; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .swatch { border-radius: 10px; padding: 12px; height: 96px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--ink-12); }
  .name { font-family: var(--font-body); font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: .7; }
  .group { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-60); margin: 0 0 8px; }
  .row + .group { margin-top: 16px; }
</style>
</head>
<body>
  <p class="group">Ink · text</p>
  <div class="row">
    <div class="swatch" style="background:#1F2428;color:#F7F4EE"><span class="name">ink</span><div class="hex">#1F2428</div></div>
    <div class="swatch" style="background:#FBF9F4;color:#1F242899;border:1px solid #1F242833"><span class="name" style="color:#1F2428">ink/60</span><div class="hex">60% — muted</div></div>
    <div class="swatch" style="background:#FBF9F4;color:#1F242866;border:1px solid #1F242833"><span class="name" style="color:#1F2428">ink/40</span><div class="hex">40% — subtle</div></div>
    <div class="swatch" style="background:#FBF9F4;color:#1F24281F;border:1px solid #1F242833"><span class="name" style="color:#1F2428">ink/12</span><div class="hex">12% — border</div></div>
  </div>
  <p class="group">Paper · backgrounds</p>
  <div class="row">
    <div class="swatch" style="background:#FBF9F4;color:#1F2428"><span class="name">paper-card</span><div class="hex">#FBF9F4</div></div>
    <div class="swatch" style="background:#F7F4EE;color:#1F2428"><span class="name">paper ★</span><div class="hex">#F7F4EE</div></div>
    <div class="swatch" style="background:#EFEAE0;color:#1F2428"><span class="name">paper-sunk</span><div class="hex">#EFEAE0</div></div>
    <div class="swatch" style="background:#FFFFFF;color:#1F2428"><span class="name">white</span><div class="hex">#FFFFFF — pin halo only</div></div>
  </div>
</body>
</html>
