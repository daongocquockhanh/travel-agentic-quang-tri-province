<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Brand · Logo lockup</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 24px; }
  .card { display: flex; align-items: center; gap: 32px; padding: 12px 0; }
  .mark { display: flex; align-items: center; gap: 14px; }
  .mark .qt {
    width: 56px; height: 56px; border-radius: 12px;
    background: var(--teal-700);
    color: var(--paper); font-family: var(--font-display);
    font-weight: 500; font-size: 26px;
    display: grid; place-items: center; letter-spacing: -0.5px;
  }
  .word { font-family: var(--font-display); font-size: 30px; color: var(--teal-700); letter-spacing: -0.01em; line-height: 1; }
  .sub { font-family: var(--font-body); font-size: 10px; font-weight: 500; letter-spacing: 2px; color: var(--ink-60); margin-top: 6px; }
  .divider { width: 1px; height: 56px; background: var(--ink-12); }
  .alt { width: 56px; height: 56px; border-radius: 12px; display:grid; place-items:center; font-family: var(--font-display); font-size: 22px; font-weight: 500; letter-spacing: -0.5px; }
  .alt.paper { background: var(--paper); color: var(--teal-700); border: 1px solid var(--ink-12); }
  .alt.sand { background: var(--sand-300); color: var(--teal-900); }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <div class="qt">QT</div>
      <div>
        <div class="word">Quảng Trị</div>
        <div class="sub">TRAVEL AGENT</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="alt paper">QT</div>
    <div class="alt sand">QT</div>
  </div>
</body>
</html>
