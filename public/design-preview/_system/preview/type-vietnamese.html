<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Type · Vietnamese diacritics</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 20px; }
  .group { font-family: var(--font-body); font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-60); margin: 0 0 6px; }
  .group + .group { margin-top: 14px; }
  .stack { display: flex; flex-direction: column; gap: 2px; }
  .vi { font-family: var(--font-display); font-size: 30px; font-weight: 500; line-height: 1.1; letter-spacing: -0.005em; }
  .en { font-family: var(--font-display); font-style: italic; font-size: 18px; color: var(--ink-60); line-height: 1.2; }
  .rule { color: var(--ink-60); font-size: 12px; font-family: var(--font-mono); margin-top: 6px; }
</style>
</head>
<body>
  <p class="group">Display · Newsreader 500 — diacritic stress test</p>
  <div class="stack">
    <div class="vi">Việt Nam · Quảng Trị · Vĩnh Mốc · Hội An · Đông Hà</div>
    <div class="en">Vietnam · Quang Tri · Vinh Moc · Hoi An · Dong Ha</div>
  </div>
  <p class="group">Body · Be Vietnam Pro 400</p>
  <div class="p" style="line-height:1.55;">Bãi tắm Cửa Tùng vắng nhất lúc sáng sớm. Mở từ 5h, vé 30.000đ, bãi gửi xe ngay cổng phía bắc.</div>
</body>
</html>
