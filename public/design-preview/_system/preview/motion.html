<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Motion · Easing &amp; durations</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 20px; font-family: var(--font-body); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .item { background: var(--paper-card); border: 1px solid var(--ink-12); border-radius: 10px; padding: 12px 14px; }
  .lbl { font-family: var(--font-mono); font-size: 11px; color: var(--ink-60); }
  .val { font-family: var(--font-display); font-size: 20px; margin-top: 2px; }
  .sub { font-size: 12px; color: var(--ink-60); margin-top: 4px; }
  .curve { margin-top: 10px; height: 36px; background: var(--paper-sunk); border-radius: 6px; position: relative; overflow: hidden; }
  .curve .ball { position: absolute; top: 50%; transform: translate(0, -50%); width: 18px; height: 18px; border-radius: 999px; background: var(--teal-700); animation: slide 1.8s var(--ease) infinite; }
  @keyframes slide { 0% { left: 4px; } 50% { left: calc(100% - 22px); } 100% { left: 4px; } }
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="lbl">--ease</div><div class="val">cubic-bezier(.32,.72,0,1)</div><div class="sub">single ease across the system</div><div class="curve"><div class="ball"></div></div></div>
    <div class="item"><div class="lbl">--dur-micro · 180ms</div><div class="val">Press, chip select</div><div class="sub">--dur-small · 240ms · banner slide</div><div class="sub">--dur-medium · 360ms · sheet snap</div><div class="sub">--dur-large · 600ms · map fly-to</div></div>
  </div>
</body>
</html>
