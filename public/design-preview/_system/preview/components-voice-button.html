<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Components · Voice button states</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 28px; }
  .row { display: flex; gap: 28px; align-items: flex-start; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .fab { width: 64px; height: 64px; border-radius: 999px; display: grid; place-items: center; box-shadow: var(--shadow-lift); color: #F7F4EE; }
  .fab.idle { background: var(--teal-700); animation: breathe 1.6s var(--ease) infinite; }
  .fab.recording { background: var(--yellow-500); color: var(--ink); }
  .fab.transcribing { background: var(--paper-card); color: var(--teal-700); border: 1px solid var(--ink-12); }
  .fab.speaking { background: var(--teal-500); }
  .fab.error { background: var(--paper-card); color: var(--danger); border: 1px solid var(--danger); }
  .fab svg { width: 26px; height: 26px; }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--ink-60); }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: .7; } }
  .ring { position: absolute; inset: -6px; border-radius: 999px; border: 2px solid currentColor; opacity: .3; }
  .wrap { position: relative; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="wrap"><div class="fab idle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/></svg>
    </div></div><span class="name">idle</span></div>
    <div class="item"><div class="wrap"><div class="fab recording">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
      <span class="ring" style="color:var(--yellow-500)"></span>
    </div></div><span class="name">recording</span></div>
    <div class="item"><div class="fab transcribing">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3 6"/></svg>
    </div><span class="name">transcribing</span></div>
    <div class="item"><div class="fab speaking">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="6" y1="9" x2="6" y2="15"/><line x1="10" y1="6" x2="10" y2="18"/><line x1="14" y1="9" x2="14" y2="15"/><line x1="18" y1="11" x2="18" y2="13"/></svg>
    </div><span class="name">speaking</span></div>
    <div class="item"><div class="fab error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div><span class="name">error</span></div>
  </div>
</body>
</html>
