<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=700"/>
<title>Components · Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css"/>
<style>
  body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--paper-card); border: 1px solid var(--ink-12); border-radius: 12px; font-family: var(--font-body); font-size: 15px; max-width: 520px; }
  .field input { flex: 1; border: 0; outline: none; background: transparent; font: inherit; color: var(--ink); }
  .field svg { color: var(--ink-60); flex-shrink: 0; }
  .field.focused { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in oklch, var(--accent) 30%, transparent); }
  .toggle { display: inline-flex; padding: 3px; background: var(--paper-sunk); border-radius: 999px; gap: 2px; align-self: flex-start; }
  .toggle button { font-family: var(--font-body); font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-60); cursor: pointer; }
  .toggle button.active { background: var(--paper); color: var(--ink); box-shadow: var(--shadow-soft); }
</style>
</head>
<body>
  <div class="field">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input placeholder="Ask about a place, route, or piece of history…"/>
  </div>
  <div class="field focused">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input value="Cửa Tùng" />
  </div>
  <div class="toggle">
    <button class="active">VI</button>
    <button>EN</button>
  </div>
</body>
</html>
