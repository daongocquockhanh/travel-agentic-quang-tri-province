<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Quảng Trị</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ee;
        color: #1f2428;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 22px;
        margin: 18px 0 6px;
        font-weight: 600;
      }
      p {
        margin: 0 0 4px;
        color: #5b6166;
        font-size: 15px;
      }
      .en {
        margin-top: 14px;
      }
      button {
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        background: #0f4c5c;
        color: #f7f4ee;
        font: inherit;
        font-weight: 500;
        padding: 12px 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="icon-192.png" alt="" />
      <h1>Không có kết nối mạng</h1>
      <p>Hướng dẫn viên cần Internet để mở. Hãy kiểm tra Wi-Fi hoặc dữ liệu di động rồi thử lại.</p>
      <p class="en">
        No connection. The guide needs the internet to open — check Wi-Fi or mobile data and try
        again.
      </p>
      <button type="button" id="retry">Thử lại · Try again</button>
    </main>
    <script>
      // The shell navigated here from the remote site; going back retries it.
      document.getElementById("retry").addEventListener("click", function () {
        if (history.length > 1) history.back();
        else location.reload();
      });
    </script>
  </body>
</html>
